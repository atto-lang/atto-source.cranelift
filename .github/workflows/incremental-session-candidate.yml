name: Incremental compiler session candidate
on:
  pull_request:
    paths:
      - 'src/main.rs'
      - 'src/sha256.rs'
      - 'src/compiler_cache_key.rs'
      - 'src/compiler_artifact_receipt.rs'
      - '.github/workflows/incremental-session-candidate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute real compiler candidate
        run: |
          set -eu
          cargo test --locked --bin orescranelift incremental_object_tests::exact_native_object_reuse -- --nocapture
          cargo test --locked --bin orescranelift sha256::tests:: -- --nocapture
          cargo test --locked --bin orescranelift compiler_cache_key::tests:: -- --nocapture
          cargo test --locked --bin orescranelift compiler_artifact_receipt::tests:: -- --nocapture
