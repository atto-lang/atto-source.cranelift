name: Cranelift scalar pull-push fail-closed parity gate
on:
  pull_request:
    paths:
      - 'tests/pull_push_unsupported_gate.rs'
      - '.github/workflows/pull-push-parity-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          # Verify the index is exactly the checked-in tree, without invoking
          # git diff/status or untrusted .gitattributes clean filters.
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          # Compare raw physical bytes of the workflow, test and compiled
          # frontend with their Git object identities (no filters).
          for file in .github/workflows/pull-push-parity-v1.yml tests/pull_push_unsupported_gate.rs src/frontend.rs; do
            test "$(git rev-parse "HEAD:$file")" = "$(git hash-object --no-filters "$file")"
          done
          test -z "$(git ls-files --others --exclude-standard)"
          echo "SOURCE_COMMIT=$EXPECTED_SHA"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.99.1"
      - name: Run real Cranelift parser negative and positive cases
        run: cargo test --locked --test pull_push_unsupported_gate --verbose
