name: core/types independent source-level behavior oracle
on:
  pull_request:
    paths:
      - 'core/types.atto'
      - 'src/frontend.rs'
      - 'tests/core-types-source.test.mjs'
      - 'tests/core-types-matrix-source.test.mjs'
      - 'tests/fixtures/core-types-v1/**'
      - '.github/workflows/core-types-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact PR head and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Run freestanding Atto source oracle and mutation controls
        run: |
          set -euo pipefail
          node --test tests/core-types-source.test.mjs tests/core-types-matrix-source.test.mjs
          echo 'CORE_TYPES_SOURCE_ONLY=PASS'
          echo 'CORE_TYPES_COMPILED_GUEST=NOT_EXECUTED_BY_THIS_JOB'
      - name: Preserve evidence boundary
        if: always()
        run: echo 'This workflow runs a strict source-model oracle only; it neither compiles Atto nor proves NativeAOT/Wasm/JIT guest execution.' >> "$GITHUB_STEP_SUMMARY"
  core-types-native-compiler-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision before compiler run
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
      - name: Build exact source compiler and admit actual .atto library
        run: |
          set -euo pipefail
          cargo build --locked --bin orescranelift
          target/debug/orescranelift check tests/fixtures/core-types-v1/cranelift-namespace-positive.atto
          test "$(target/debug/orescranelift run tests/fixtures/core-types-v1/cranelift-namespace-positive.atto)" = "64"
          for case in cranelift-namespace-duplicate-negative cranelift-namespace-late-negative; do
            if target/debug/orescranelift check "tests/fixtures/core-types-v1/$case.atto" >"$RUNNER_TEMP/$case.stdout" 2>"$RUNNER_TEMP/$case.stderr"; then
              echo "$case unexpectedly compiled" >&2
              exit 1
            fi
            case "$case" in
              *duplicate*) grep -Fq CRANELIFT_NAMESPACE_DUPLICATE "$RUNNER_TEMP/$case.stderr";;
              *late*) grep -Fq CRANELIFT_NAMESPACE_HEADER_ORDER "$RUNNER_TEMP/$case.stderr";;
            esac
          done
          echo 'CORE_TYPES_CRANELIFT_NAMESPACE_FRAGMENT=JIT_EXECUTED'
          # Complete library and 8 shared negatives remain separate parity gates.
          target/debug/orescranelift check core/types.atto
          target/debug/orescranelift ir core/types.atto > "$RUNNER_TEMP/core-types.clif"
          test -s "$RUNNER_TEMP/core-types.clif"
          echo 'CORE_TYPES_CRANELIFT_TYPED_IR_EMITTED=YES'
      - name: Evidence limits
        if: always()
        run: echo 'stage-0 parser and IR only; real JIT function invocation and NativeAOT not proven. Zero executed steps means NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
