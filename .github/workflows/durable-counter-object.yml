name: Cranelift native durable Counter guest
on:
  pull_request:
    paths:
      - 'src/frontend.rs'
      - 'src/backend.rs'
      - 'src/main.rs'
      - 'tests/durable_counter_object.mjs'
      - '.github/workflows/durable-counter-object.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build exact compiler and execute real native object
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          cargo build --locked
          ATTO_CRANELIFT_COMPILER="$PWD/target/debug/orescranelift" node tests/durable_counter_object.mjs
          cargo test --locked
