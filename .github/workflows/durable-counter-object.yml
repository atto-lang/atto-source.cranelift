name: Cranelift native durable Counter guest
on:
  pull_request:
    paths:
      - 'src/frontend.rs'
      - 'src/backend.rs'
      - 'src/main.rs'
      - 'tests/durable_counter_object.mjs'
      - 'tests/durable_scalar_cranelift_native.cpp'
      - '.github/workflows/durable-counter-object.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build exact compiler and execute real native object
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          cargo build --locked
          ATTO_CRANELIFT_COMPILER="$PWD/target/debug/orescranelift" node tests/durable_counter_object.mjs
          cargo test --locked
          printf '%s\n' 'define durable actor Ledger as state balance: int = -9223372036854775808; state open: bool = true; state last: int = 9223372036854775807; end' > "$RUNNER_TEMP/ledger.atto"
          target/debug/orescranelift emit-durable-scalar-object "$RUNNER_TEMP/ledger.atto" > "$RUNNER_TEMP/ledger.o"
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie tests/durable_scalar_cranelift_native.cpp "$RUNNER_TEMP/ledger.o" -o "$RUNNER_TEMP/ledger-test"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 timeout 60 "$RUNNER_TEMP/ledger-test"
