name: HTTP actor source admission
on:
  push:
    branches: ['test/http-actor-canonical-fixture-admission-20261127']
  pull_request:
    paths:
      - 'tests/fixtures/http-actor-v1/**'
      - 'tests/http_actor_unsupported_gate.rs'
      - 'tests/http-actor-fixture-pins.test.mjs'
      - 'src/frontend.rs'
      - '.github/workflows/http-actor-admission.yml'
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      - run: node --test tests/http-actor-fixture-pins.test.mjs
      - run: cargo test --locked --test http_actor_unsupported_gate
