name: Rollout receipt checker self-tests
on:
  pull_request:
    paths:
      - 'tools/rollout-evidence/**'
      - '.github/workflows/rollout-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-checker-self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source and raw receipt-checker inputs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          for file in .github/workflows/rollout-evidence.yml tools/rollout-evidence/Cargo.lock tools/rollout-evidence/Cargo.toml tools/rollout-evidence/src/main.rs tools/rollout-evidence/cases.tsv tools/rollout-evidence/tests/cli.rs; do
            test "$(git rev-parse "HEAD:$file")" = "$(git hash-object --no-filters "$file")"
          done
          test -z "$(git ls-files --others --exclude-standard)"
          echo "SOURCE_HEAD=$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --manifest-path tools/rollout-evidence/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked --all-targets -- -D warnings
      - name: Receipt inspector unit tests (not guest execution)
        run: cargo test --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked
      - name: Acceptance profile CLI
        run: cargo run --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked -- --cases
