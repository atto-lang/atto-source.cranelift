name: Cranelift native scalar smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and indexed Git tree without checkout filters
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git cat-file -t "$SOURCE_TREE")" = tree
          # Never call git diff/status on untrusted .gitattributes: external
          # clean filters can run code before compiler tests begin.
          # write-tree compares only the checkout index to exact Git objects.
          test "$(git write-tree)" = "$SOURCE_TREE"
          # Validate real worktree bytes and modes, not only indexed Git objects.
          # Inline verifier is workflow-owned: do NOT execute a checker from the untrusted checkout.
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import subprocess
          
          def git(*args):
              return subprocess.check_output(("git", *args), stderr=subprocess.PIPE)
          
          def reject(reason):
              raise SystemExit("EXACT_WORKTREE_REJECTED: " + reason)
          
          if git("rev-parse", "--show-object-format").strip() != b"sha1":
              reject("unsupported Git object format")
          if git("write-tree").strip() != git("rev-parse", "HEAD^{tree}").strip():
              reject("index tree differs from HEAD")
          count = 0
          for entry in git("ls-files", "--stage", "-z").split(b"\0"):
              if not entry:
                  continue
              try:
                  meta, encoded_path = entry.split(b"\t", 1)
                  mode, oid, stage = meta.split(b" ")
              except ValueError:
                  reject("malformed index entry")
              if stage != b"0" or mode not in (b"100644", b"100755"):
                  reject("unmerged or unsupported tracked object")
              name = os.fsdecode(encoded_path)
              parts = pathlib.Path(name).parts
              if not parts or os.path.isabs(name) or ".." in parts:
                  reject("unsafe tracked path")
              parent = pathlib.Path(".")
              for part in parts[:-1]:
                  parent = parent / part
                  if parent.is_symlink() or not parent.is_dir():
                      reject("tracked parent is not a real directory")
              try:
                  before = os.lstat(name)
                  if not stat.S_ISREG(before.st_mode):
                      reject("tracked source is not a regular file")
                  if bool(before.st_mode & 0o111) != (mode == b"100755"):
                      reject("tracked executable mode differs")
                  fd = os.open(name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
                  with os.fdopen(fd, "rb") as stream:
                      opened = os.fstat(stream.fileno())
                      if (opened.st_dev, opened.st_ino) != (before.st_dev, before.st_ino):
                          reject("tracked source swapped during open")
                      digest = hashlib.sha1()
                      digest.update(b"blob " + str(opened.st_size).encode() + b"\0")
                      size = 0
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          size += len(chunk)
                          digest.update(chunk)
                      after = os.fstat(stream.fileno())
                  stamp = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                  if size != opened.st_size or stamp(opened) != stamp(after):
                      reject("tracked source changed during snapshot")
                  if digest.hexdigest().encode() != oid:
                      reject("tracked raw bytes differ from indexed Git object")
              except OSError as exc:
                  reject("tracked file could not be checked: " + str(exc))
              count += 1
          if git("ls-files", "--others", "-z"):
              reject("untracked checkout file exists")
          print("EXACT_WORKTREE_PASS files=" + str(count))
          PY
          echo "SOURCE_COMMIT=$EXPECTED"
          echo "SOURCE_TREE=$SOURCE_TREE"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Enforce canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile and execute locked native JIT tests
        run: cargo test --locked --all-targets --verbose
      - name: Enforce Clippy diagnostics
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Executable source smoke
        run: |
          set -euo pipefail
          printf 'fnc main(x:int):int{return (x+2)*3;}\n' > "$RUNNER_TEMP/smoke.ores"
          test "$(cargo run --locked --quiet -- run "$RUNNER_TEMP/smoke.ores" 12)" = 42
