name: Cranelift native scalar smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify raw pinned source tree without invoking worktree filters
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_checkout_raw.py
          echo "SOURCE_COMMIT=$EXPECTED_SHA"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Enforce canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile and execute locked native JIT tests
        run: cargo test --locked --all-targets --verbose
      - name: Enforce Clippy diagnostics
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Executable source smoke
        run: |
          set -euo pipefail
          printf 'fnc main(x:int):int{return (x+2)*3;}\n' > "$RUNNER_TEMP/smoke.ores"
          test "$(cargo run --locked --quiet -- run "$RUNNER_TEMP/smoke.ores" 12)" = 42
