name: Cranelift native scalar smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact commit and indexed Git tree without checkout filters
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git cat-file -t "$SOURCE_TREE")" = tree
          # Never call git diff/status on untrusted .gitattributes: external
          # clean filters can run code before compiler tests begin.
          # write-tree compares only the checkout index to exact Git objects.
          test "$(git write-tree)" = "$SOURCE_TREE"
          echo "SOURCE_COMMIT=$EXPECTED"
          echo "SOURCE_TREE=$SOURCE_TREE"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Enforce canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile and execute locked native JIT tests
        run: cargo test --locked --all-targets --verbose
      - name: Enforce Clippy diagnostics
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Executable source smoke
        run: |
          set -euo pipefail
          printf 'fnc main(x:int):int{return (x+2)*3;}\n' > "$RUNNER_TEMP/smoke.ores"
          test "$(cargo run --locked --quiet -- run "$RUNNER_TEMP/smoke.ores" 12)" = 42
