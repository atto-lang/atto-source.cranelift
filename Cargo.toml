[package]
name = "orescranelift"
default-run = "orescranelift"
version = "0.1.0"
edition = "2024"
publish = false

# Pin direct dependencies to one Cranelift release. A Cargo.lock is required
# before release; without it transitive dependency resolution is not frozen.
[dependencies]
cranelift-codegen = "=0.137.0"
cranelift-frontend = "=0.137.0"
cranelift-jit = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-native = "=0.137.0"
cranelift-object = "=0.137.0"
libc = "=0.2.191"

[profile.release]
overflow-checks = true
